<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page with ID and Class</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
    
        #header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
        }
    
        .content {
            color: #333;
            padding: 10px;
        }
    
        #footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 5px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header id="header">
        <h1>Welcome!</h1>
    </header>

    <p class="content">This is a simple page using internal CSS with ID and Class selectors.</p>
</body>
</html>
