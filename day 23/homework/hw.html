<!-- using only inline-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body>
    <h1 style="color: blue; font-size: 36px;"></h1>
    <p style="color: green; font-family: Arial; font-size: 20px;">
        
    </p>
</body>
</html>

<!-- using internal-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>
    <style>
        h1 {
            color: blue;
            font-size: 36px;
        }
        p {
            color: green;
            font-family: Arial;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Internal CSS</h1>
    <p>internal CSS</p>
</body>
</html>

<!--external-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>This is a Heading with External CSS</h1>
    <p>This paragraph is styled using external CSS.</p>
</body>
</html>
