<html>
<head>
    <title>Payment Options</title>
</head>
<body>
    <form>
        <p>Payment Method:</p>
        <input type="radio" id="card" name="PaymentMethod" value="card">
        <label for="card">Pay by Card</label><br>
        
        <input type="radio" id="cash" name="PaymentMethod" value="cash">
        <label for="cash">Pay by Cash</label><br>
        
        <input type="radio" id="crypto" name="PaymentMethod" value="crypto">
        <label for="crypto">Pay by Crypto</label><br><br>
        
        <input type="submit" value="Submit">
    </form>
</body>
</html>


<!--creating a checkbox where a user can choose 5 hobbies-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Hobbies</title>
</head>
<body>
    <h2>Choose Your Hobbies</h2>
    <form>
        <input type="checkbox" id="hobby1" name="hobby1" value="Reading">
        <label for="hobby1">Reading</label><br>
        <input type="checkbox" id="hobby2" name="hobby2" value="Traveling">
        <label for="hobby2">Traveling</label><br>
        <input type="checkbox" id="hobby3" name="hobby3" value="Cooking">
        <label for="hobby3">Cooking</label><br>
        <input type="checkbox" id="hobby4" name="hobby4" value="Gardening">
        <label for="hobby4">Gardening</label><br>
        <input type="checkbox" id="hobby5" name="hobby5" value="Photography">
        <label for="hobby5">Photography</label><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
