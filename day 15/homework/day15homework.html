<head>
    <title>form</title>
</head>
<body>
        <form>
        <h2>please register</h2>
        <input type="name" name="name" placeholder="enter ur name"><br><br>
        <input type="email" name="email" placeholder="enter ur email" required><br><br>
        <input type="password" name="password" placeholder="enter ur password"  required><br><br>
        <button type="submit">submit</button>
        <br>
        <h2>choose ur country</h2>
        <input type="checkbox" id="geo" value="georgia" name="country">
        <label for="geo">Georgia</label>
        <input type="checkbox" id="usa" value="united states" name="country">
        <label for="usa">United States</label>
        <input type="checkbox" id="fra" value="france" name="country">
        <label for="fra">France</label>
        <br>
        <h2>choose ur gender</h2>
        <input type="radio" id="fm" value="female" name="gender">
        <label for="fm">female</label>
        <input type="radio" id="m" value="male" name="gender">
        <label for="m">male</label>
        <br>
        <input type="checkbox" id="pr" value="privacy policy" name="privacy policy"
        <label for="pr">I am accepting privacy policies</label>
        <h2>Choose Your Hobbies</h2>
        <input type="checkbox" id="hobby1" name="hobby1" value="Reading">
        <label for="hobby1">Reading</label><br>
        <input type="checkbox" id="hobby2" name="hobby2" value="Traveling">
        <label for="hobby2">Traveling</label><br>
        <input type="checkbox" id="hobby3" name="hobby3" value="Cooking">
        <label for="hobby3">Cooking</label><br>
        <input type="checkbox" id="hobby4" name="hobby4" value="Gardening">
        <label for="hobby4">Gardening</label><br>
        <input type="checkbox" id="hobby5" name="hobby5" value="Photography">
        <label for="hobby5">Photography</label><br>
        <input type="submit" value="Submit">
        <br>
        <h2>upload a profile picture</h2>
        <label for="profilePicture">upload a profile pic</label>
        <input type="file" id="profilePicture" name="profilePicture" accept="image/*">
        <button type="submit">upload</button>
        <br>
        <h2>choose your birthdate</h2>
        <label for="birthdate">choose ur birthdate</label>
        <input type="date" id="birthdate" name="birthdate">
        <button type="submit">submit</button>
        <button type="reset">reset</button>
        <br>
        <h2>choose which one you have</h2>
        <input type="radio" id="bro" value="brother" name="human">
        <label for="bro">brother</label>
        <input type="radio" id="sis" value="sister" name="human">
        <label for="sis">sister</label>
        <input type="radio" id="both" value="both" name="human">
        <label for="both">both</label>
        </form>
</body>
</html>
