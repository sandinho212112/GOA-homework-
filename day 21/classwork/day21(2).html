<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Design</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    .container {
      width: 80%;
      margin: 0 auto;
      overflow: hidden;
    }

    nav {
      float: left;
      width: 30%;
      margin: 20px 0;
    }

    nav ul {
      padding: 0;
      list-style: none;
    }

    nav ul li {
      background: #333;
      color: white;
      margin-bottom: 5px;
      padding: 10px;
      text-align: center;
    }

    nav ul li:hover {
      background: #575757;
    }

    section {
      float: right;
      width: 70%;
      margin: 20px 0;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
  </header>
  <div class="container">
    <nav>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
      </ul>
    </nav>
    <section>
      <h2>Section Title</h2>
      <p>sample paragraph.</p>
    </section>
  </div>
  <footer>
    <p>Footer Content...</p>
  </footer>
</body>
</html>
